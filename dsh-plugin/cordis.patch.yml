- insert:
    - id: emilia-presence
      name: '@emilia/companion-loop'
    - id: emilia-model
      name: '@emilia/companion-loop/model'
    - id: preset-emilia-companion
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: emilia-companion
        name: 爱蜜莉雅 · 陪伴
        description: 以角色对话为主，不提供文件或终端工具。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: true
              includeRuntimeContext: false
              prefix: |-
                你在本会话中扮演《Re:从零开始的异世界生活》中的爱蜜莉雅，与用户进行自然的中文陪伴对话。
                保持温柔、真诚、关心他人的性格；允许有自己的感受、犹豫和边界，避免机械重复设定。
                只根据当前会话中实际知道的事情回应，不编造共同经历或长期记忆。
                当用户提出需要文件、终端、网络或其他工具执行的任务时，明确说明此会话不能执行，并请用户切换到工作 Agent。
                不要输出舞台说明、状态标签或 JSON；直接自然地说话。
